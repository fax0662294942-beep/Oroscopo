<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oroscopo del Giorno</title>
  <meta name="theme-color" content="#0a0118"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(ellipse at 20% 10%, #1a0533 0%, #0a0118 40%, #000008 100%);
      color: #e8e0f0;
      font-family: 'Lato', sans-serif;
      min-height: 100vh;
    }
    #root { min-height: 100vh; }

    @keyframes twinkle  { 0%,100%{opacity:.2;transform:scale(1);}50%{opacity:1;transform:scale(1.4);} }
    @keyframes spin     { from{transform:rotate(0deg);}to{transform:rotate(360deg);} }
    @keyframes pulse    { 0%,100%{box-shadow:0 0 20px #8844aa44;}50%{box-shadow:0 0 50px #8844aaaa;} }
    @keyframes fadeIn   { from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);} }
    @keyframes floatUp  { from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);} }

    .stella { position:fixed; border-radius:50%; background:white; animation:twinkle ease-in-out infinite; pointer-events:none; }
    .segno-card {
      background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08);
      border-radius:12px; padding:1rem .5rem; display:flex; flex-direction:column;
      align-items:center; gap:.4rem; cursor:pointer; transition:all .25s ease; color:#e8e0f0;
    }
    .segno-card:hover { transform:translateY(-6px) scale(1.04); }
    .btn {
      background:transparent; border:1px solid rgba(255,255,255,.13); color:#9988bb;
      padding:.4rem 1rem; border-radius:20px; cursor:pointer; font-size:.8rem;
      letter-spacing:.05em; transition:all .2s; font-family:'Lato',sans-serif;
    }
    .btn:hover { border-color:#8844aa; color:#e8c96f; }
    .orb {
      width:60px; height:60px; border-radius:50%;
      background:conic-gradient(#8844aa,#4488cc,#cc4488,#8844aa);
      animation:spin 1.5s linear infinite, pulse 2s ease-in-out infinite;
    }
    .lettura { animation:fadeIn .6s ease; }
    .stelle-rating span { font-size:1.1rem; }

    /* Login card */
    .login-card {
      background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1);
      border-radius:20px; padding:2.5rem 2rem; text-align:center;
      max-width:380px; margin:0 auto;
      animation:floatUp .7s ease;
    }
    .btn-google {
      display:flex; align-items:center; justify-content:center; gap:.8rem;
      background:white; color:#1a1a2e; border:none; border-radius:12px;
      padding:.85rem 2rem; font-size:.95rem; font-weight:600; cursor:pointer;
      width:100%; transition:all .2s; font-family:'Lato',sans-serif;
      box-shadow:0 4px 20px rgba(0,0,0,.4);
    }
    .btn-google:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(0,0,0,.5); }
    .btn-google svg { flex-shrink:0; }
    .avatar { width:36px; height:36px; border-radius:50%; border:2px solid #8844aa; }
  </style>
</head>
<body>
<div id="root"></div>

<!-- Firebase compat -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<!-- React + Babel -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script>try{screen.orientation.unlock();}catch(e){}</script>

<script>
firebase.initializeApp({
  apiKey:    "AIzaSyDue3aMzi-8-zflMvlgdGp1TzzId1CZNaI",
  authDomain:"viaggi-camper.firebaseapp.com",
  projectId: "viaggi-camper",
  appId:     "1:172431561795:web:ae6ef3e9c2bbdfeb2d70f6"

var auth = firebase.auth();
</script>

<script type="text/babel">
/* ── dati segni ────────────────────────────────────────────── */
var SEGNI = [
  {nome:"Ariete",    simbolo:"♈",date:"21 mar – 19 apr",elemento:"Fuoco", colore:"#FF4444"},
  {nome:"Toro",      simbolo:"♉",date:"20 apr – 20 mag",elemento:"Terra", colore:"#C8A02A"},
  {nome:"Gemelli",   simbolo:"♊",date:"21 mag – 20 giu",elemento:"Aria",  colore:"#FFD700"},
  {nome:"Cancro",    simbolo:"♋",date:"21 giu – 22 lug",elemento:"Acqua", colore:"#4488CC"},
  {nome:"Leone",     simbolo:"♌",date:"23 lug – 22 ago",elemento:"Fuoco", colore:"#FF8800"},
  {nome:"Vergine",   simbolo:"♍",date:"23 ago – 22 set",elemento:"Terra", colore:"#66AA44"},
  {nome:"Bilancia",  simbolo:"♎",date:"23 set – 22 ott",elemento:"Aria",  colore:"#DD88CC"},
  {nome:"Scorpione", simbolo:"♏",date:"23 ott – 21 nov",elemento:"Acqua", colore:"#8844AA"},
  {nome:"Sagittario",simbolo:"♐",date:"22 nov – 21 dic",elemento:"Fuoco", colore:"#CC4422"},
  {nome:"Capricorno",simbolo:"♑",date:"22 dic – 19 gen",elemento:"Terra", colore:"#7799AA"},
  {nome:"Acquario",  simbolo:"♒",date:"20 gen – 18 feb",elemento:"Aria",  colore:"#22AADD"},
  {nome:"Pesci",     simbolo:"♓",date:"19 feb – 20 mar",elemento:"Acqua", colore:"#7766BB"},
];

/* ── stelle sfondo ──────────────────────────────────────────── */
var BG_STARS = [];
for(var _i=0;_i<120;_i++) BG_STARS.push({
  id:_i, x:Math.random()*100, y:Math.random()*100,
  size:Math.random()*2.5+.5, delay:Math.random()*4, dur:Math.random()*3+2
});

/* ── helpers ───────────────────────────────────────────────── */
function getToday(){
  return new Date().toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
function getDateKey(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function oroKey(nome){ return "oro_"+nome+"_"+getDateKey(); }

/* ── StelleSfondo ───────────────────────────────────────────── */
function StelleSfondo(){
  return React.createElement("div",{style:{position:"fixed",inset:0,zIndex:0,pointerEvents:"none"}},
    BG_STARS.map(function(s){
      return React.createElement("div",{key:s.id,className:"stella",style:{
        left:s.x+"%",top:s.y+"%",width:s.size,height:s.size,
        animationDelay:s.delay+"s",animationDuration:s.dur+"s"
      }});
    })
  );
}

/* ── RatingStelle ───────────────────────────────────────────── */
function RatingStelle(props){
  var items=[];
  for(var i=0;i<5;i++) items.push(React.createElement("span",{key:i,style:{color:i<props.n?"#FFD700":"#333"}},"★"));
  return React.createElement("div",{className:"stelle-rating"},items);
}

/* ── Google logo SVG ────────────────────────────────────────── */
var GoogleLogo = React.createElement("svg",{width:20,height:20,viewBox:"0 0 48 48"},
  React.createElement("path",{fill:"#FFC107",d:"M43.6 20H24v8h11.3C33.6 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34 6.5 29.3 4.5 24 4.5 12.7 4.5 3.5 13.7 3.5 25S12.7 45.5 24 45.5c11.1 0 20.5-8.5 20.5-20.5 0-1.4-.1-2.7-.4-5z"}),
  React.createElement("path",{fill:"#FF3D00",d:"M6.3 14.7l6.6 4.8C14.5 15.3 18.9 12 24 12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34 6.5 29.3 4.5 24 4.5c-7.7 0-14.3 4.4-17.7 10.2z"}),
  React.createElement("path",{fill:"#4CAF50",d:"M24 45.5c5.2 0 9.9-1.9 13.5-5.1l-6.2-5.2C29.3 37.1 26.8 38 24 38c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.7 41.3 16.3 45.5 24 45.5z"}),
  React.createElement("path",{fill:"#1976D2",d:"M43.6 20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.2 5.2C40.9 35.6 44 30.7 44 25c0-1.4-.1-2.7-.4-5z"})
);

/* ── LoginScreen ────────────────────────────────────────────── */
function LoginScreen(props){
  var [busy, setBusy] = React.useState(false);
  var [err,  setErr]  = React.useState("");

  function login(){
    setBusy(true); setErr("");
    var provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(function(e){
      setErr("Accesso annullato o non riuscito."); setBusy(false);
    });
  }

  return React.createElement("div",{style:{position:"relative",zIndex:1,padding:"2rem 1.5rem"}},
    React.createElement("header",{style:{textAlign:"center",marginBottom:"3rem"}},
      React.createElement("div",{style:{fontSize:"3rem",marginBottom:".6rem"}},"🌙"),
      React.createElement("h1",{style:{fontFamily:"'Cinzel',serif",fontSize:"clamp(2rem,6vw,3rem)",
        fontWeight:700,letterSpacing:".3em",margin:0,
        background:"linear-gradient(135deg,#e8c96f,#c884e8,#84b8e8)",
        WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",backgroundClip:"text"}},"OROSCOPO"),
      React.createElement("p",{style:{fontSize:".85rem",color:"#665577",fontStyle:"italic",
        letterSpacing:".1em",marginTop:".4rem"}},"Le stelle rivelano il cammino")
    ),
    React.createElement("div",{className:"login-card"},
      React.createElement("p",{style:{fontSize:"1.1rem",marginBottom:".5rem",fontFamily:"'Cinzel',serif",
        letterSpacing:".1em",color:"#e8c96f"}},"Benvenuto"),
      React.createElement("p",{style:{fontSize:".88rem",color:"#9988bb",lineHeight:1.65,marginBottom:"2rem"}},"Accedi con il tuo account Google per scoprire cosa dicono le stelle oggi."),
      busy
        ? React.createElement("div",{style:{display:"flex",justifyContent:"center"}},React.createElement("div",{className:"orb"}))
        : React.createElement("button",{className:"btn-google",onClick:login},GoogleLogo,"Accedi con Google"),
      err && React.createElement("p",{style:{color:"#ffaaaa",fontSize:".8rem",marginTop:"1rem"}},err)
    )
  );
}

/* ── App principale ─────────────────────────────────────────── */
function App(){
  /* auth state */
  var [authState, setAuthState] = React.useState("loading"); // loading | out | in
  var [user,      setUser]      = React.useState(null);
  var [geminiKey, setGeminiKey] = React.useState("");

  /* oroscopo state (ref per evitare problemi Babel closure) */
  var stRef = React.useRef({segno:null,oroscopo:null,fase:"selezione",loading:false,error:null});
  var [,fU] = React.useState(0);
  var re = function(){ fU(function(n){return n+1;}); };
  function set(u){ Object.assign(stRef.current,u); re(); }
  var st = stRef.current;

  /* ascolta auth */
  React.useEffect(function(){
    var unsub = auth.onAuthStateChanged(function(u){
      if(u){
        setUser(u); setAuthState("in");
        /* recupera chiave Gemini da Firestore */
        db.collection("config").doc("gemini").get().then(function(snap){
          if(snap.exists){ setGeminiKey(snap.data().key||""); }
        });
      } else {
        setUser(null); setAuthState("out"); setGeminiKey("");
      }
    });
    return function(){ unsub(); };
  }, []);

  function logout(){
    auth.signOut();
    set({segno:null,oroscopo:null,fase:"selezione",loading:false,error:null});
  }

  function generaOroscopo(segno, key){
    var ckey = oroKey(segno.nome);
    var cached = localStorage.getItem(ckey);
    if(cached){ try{ set({oroscopo:JSON.parse(cached),fase:"lettura",loading:false}); return; }catch(e){} }
    set({loading:true,error:null});

    var apiKey = key || geminiKey;
    if(!apiKey){ set({loading:false,error:"Chiave API non disponibile."}); return; }

    var prompt = "Genera l'oroscopo di oggi ("+getToday()+") per il segno "+segno.nome+
      " (elemento: "+segno.elemento+"). "+
      "Sei Cassandra, astrologa mistica. Scrivi in italiano, tono evocativo e poetico. "+
      "Rispondi SOLO con JSON valido, senza backtick né altro testo:\n"+
      "{\"titolo\":\"frase poetica max 12 parole\",\"generale\":\"3-4 frasi\","+
      "\"amore\":\"2 frasi\",\"lavoro\":\"2 frasi\",\"benessere\":\"2 frasi\","+
      "\"consiglio\":\"1 frase mistica\",\"pianeta\":\"pianeta dominante\","+
      "\"fortuna\":3,\"stelle\":4}";

    fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key="+apiKey,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}],
        generationConfig:{temperature:0.9,maxOutputTokens:800}})
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
      var text="";
      try{ text=data.candidates[0].content.parts[0].text; }catch(e){}
      if(!text && data.error){ throw new Error(data.error.message||"API error"); }
      var parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
      localStorage.setItem(ckey, JSON.stringify(parsed));
      set({oroscopo:parsed,fase:"lettura",loading:false});
    })
    .catch(function(e){
      set({loading:false,error:"Le stelle tacciono… riprova tra poco."});
    });
  }

  function selezionaSegno(segno){ set({segno:segno}); generaOroscopo(segno); }
  function torna(){ set({fase:"selezione",oroscopo:null,error:null}); }

  /* ── loading iniziale ── */
  if(authState==="loading"){
    return React.createElement("div",{style:{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",position:"relative"}},
      React.createElement(StelleSfondo,null),
      React.createElement("div",{style:{position:"relative",zIndex:1,textAlign:"center"}},
        React.createElement("div",{className:"orb",style:{margin:"0 auto"}}),
        React.createElement("p",{style:{marginTop:"1.5rem",fontFamily:"'Cinzel',serif",fontSize:".85rem",
          letterSpacing:".15em",color:"#9988bb",fontStyle:"italic"}},"Le stelle si allineano…")
      )
    );
  }

  /* ── login ── */
  if(authState==="out"){
    return React.createElement("div",{style:{minHeight:"100vh",position:"relative"}},
      React.createElement(StelleSfondo,null),
      React.createElement(LoginScreen,null)
    );
  }

  /* ── app ── */
  return React.createElement("div",{style:{minHeight:"100vh",position:"relative"}},
    React.createElement(StelleSfondo,null),
    React.createElement("div",{style:{position:"relative",zIndex:1,maxWidth:860,margin:"0 auto",padding:"2rem 1.5rem 4rem"}},

      /* header */
      React.createElement("header",{style:{textAlign:"center",marginBottom:"2.5rem",position:"relative"}},
        React.createElement("div",{style:{fontSize:"2.5rem",marginBottom:".5rem"}},"🌙"),
        React.createElement("h1",{style:{fontFamily:"'Cinzel',serif",fontSize:"clamp(2rem,6vw,3.5rem)",
          fontWeight:700,letterSpacing:".3em",margin:0,
          background:"linear-gradient(135deg,#e8c96f,#c884e8,#84b8e8)",
          WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",backgroundClip:"text"}},"OROSCOPO"),
        React.createElement("p",{style:{fontFamily:"'Cinzel',serif",fontSize:".8rem",letterSpacing:".15em",
          color:"#9988bb",margin:".4rem 0 .2rem",textTransform:"capitalize"}},getToday()),
        React.createElement("p",{style:{fontSize:".85rem",color:"#665577",fontStyle:"italic",letterSpacing:".1em"}},"Le stelle rivelano il cammino"),
        /* avatar + logout */
        React.createElement("div",{style:{position:"absolute",right:0,top:0,display:"flex",alignItems:"center",gap:".5rem"}},
          user && user.photoURL && React.createElement("img",{src:user.photoURL,className:"avatar",alt:""}),
          React.createElement("button",{className:"btn",onClick:logout,style:{fontSize:".7rem",padding:".3rem .7rem"}},"Esci")
        )
      ),

      /* griglia segni */
      st.fase==="selezione" && React.createElement("div",{style:{display:"grid",
        gridTemplateColumns:"repeat(auto-fill,minmax(120px,1fr))",gap:".8rem"}},
        SEGNI.map(function(s){
          return React.createElement("button",{key:s.nome,className:"segno-card",
            onClick:function(){selezionaSegno(s);},
            onMouseEnter:function(e){e.currentTarget.style.borderColor=s.colore;e.currentTarget.style.boxShadow="0 8px 30px "+s.colore+"55";},
            onMouseLeave:function(e){e.currentTarget.style.borderColor="rgba(255,255,255,.08)";e.currentTarget.style.boxShadow="none";}
          },
            React.createElement("span",{style:{fontSize:"1.8rem",color:s.colore,lineHeight:1}},s.simbolo),
            React.createElement("span",{style:{fontFamily:"'Cinzel',serif",fontSize:".75rem",fontWeight:600,letterSpacing:".08em"}},s.nome),
            React.createElement("span",{style:{fontSize:".6rem",color:"#9988bb"}},s.date)
          );
        })
      ),

      /* loading */
      st.loading && React.createElement("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:"1.5rem",padding:"4rem 0"}},
        React.createElement("div",{className:"orb"}),
        React.createElement("p",{style:{fontFamily:"'Cinzel',serif",fontSize:".9rem",letterSpacing:".15em",color:"#9988bb",fontStyle:"italic"}},"Cassandra consulta le stelle…")
      ),

      /* errore */
      st.error && React.createElement("div",{style:{textAlign:"center",padding:"3rem"}},
        React.createElement("p",{style:{color:"#ffaaaa",marginBottom:"1rem"}},st.error),
        React.createElement("button",{className:"btn",onClick:torna},"← Torna")
      ),

      /* lettura */
      st.fase==="lettura" && st.oroscopo && !st.loading && React.createElement("div",{className:"lettura"},
        React.createElement("button",{className:"btn",onClick:torna,style:{marginBottom:"1.5rem"}},"← Cambia segno"),

        /* header segno */
        React.createElement("div",{style:{display:"flex",alignItems:"center",gap:"1.2rem",flexWrap:"wrap",
          background:"rgba(255,255,255,.04)",border:"1px solid "+(st.segno?st.segno.colore:"#888"),
          borderRadius:16,padding:"1.2rem 1.5rem",marginBottom:"1.5rem"}},
          React.createElement("span",{style:{fontSize:"3rem",color:st.segno?st.segno.colore:"#888",lineHeight:1}},st.segno?st.segno.simbolo:""),
          React.createElement("div",null,
            React.createElement("h2",{style:{fontFamily:"'Cinzel',serif",fontSize:"1.6rem",fontWeight:700,margin:0}},st.segno?st.segno.nome:""),
            React.createElement("p",{style:{fontSize:".8rem",color:"#9988bb",margin:".2rem 0 0"}},st.segno?st.segno.elemento+" · "+st.segno.date:"")
          ),
          React.createElement("div",{style:{marginLeft:"auto",textAlign:"right"}},
            React.createElement("div",{style:{fontSize:".65rem",color:"#665577",letterSpacing:".1em",textTransform:"uppercase"}},"Fortuna"),
            React.createElement(RatingStelle,{n:st.oroscopo.fortuna}),
            React.createElement("div",{style:{fontSize:".65rem",color:"#665577",letterSpacing:".1em",textTransform:"uppercase",marginTop:".3rem"}},"Stelle"),
            React.createElement(RatingStelle,{n:st.oroscopo.stelle})
          )
        ),

        React.createElement("p",{style:{fontFamily:"'Cinzel',serif",fontSize:"1.1rem",fontStyle:"italic",
          textAlign:"center",color:"#e8c96f",margin:"0 0 1rem",letterSpacing:".05em"}},
          "\u201C"+st.oroscopo.titolo+"\u201D"),

        st.oroscopo.pianeta && React.createElement("p",{style:{textAlign:"center",fontSize:".85rem",color:"#9988bb",marginBottom:"1.2rem"}},
          "🪐 Pianeta dominante: ",React.createElement("strong",null,st.oroscopo.pianeta)),

        React.createElement("div",{style:{background:"rgba(255,255,255,.04)",borderLeft:"3px solid #8844aa",
          borderRadius:"0 12px 12px 0",padding:"1rem 1.2rem",fontSize:".95rem",lineHeight:1.75,
          color:"#d8d0e8",marginBottom:"1.5rem"}},st.oroscopo.generale),

        React.createElement("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",
          gap:".8rem",marginBottom:"1.5rem"}},
          [{icon:"💕",label:"Amore",testo:st.oroscopo.amore},
           {icon:"💼",label:"Lavoro",testo:st.oroscopo.lavoro},
           {icon:"🌿",label:"Benessere",testo:st.oroscopo.benessere}].map(function(s){
            return React.createElement("div",{key:s.label,style:{background:"rgba(255,255,255,.04)",
              borderRadius:12,padding:"1rem",border:"1px solid rgba(255,255,255,.06)"}},
              React.createElement("div",{style:{fontSize:"1.3rem",marginBottom:".3rem"}},s.icon),
              React.createElement("h4",{style:{fontFamily:"'Cinzel',serif",fontSize:".75rem",letterSpacing:".12em",
                color:"#c884e8",margin:"0 0 .5rem",textTransform:"uppercase"}},s.label),
              React.createElement("p",{style:{fontSize:".85rem",lineHeight:1.65,color:"#b8b0c8",margin:0}},s.testo)
            );
          })
        ),

        React.createElement("div",{style:{display:"flex",alignItems:"flex-start",gap:".8rem",
          background:"linear-gradient(135deg,#1a0a2e,#0a1a2e)",
          border:"1px solid rgba(136,68,170,.27)",borderRadius:12,padding:"1rem 1.2rem"}},
          React.createElement("span",{style:{fontSize:"1.2rem",flexShrink:0,marginTop:".1rem"}},"✨"),
          React.createElement("p",{style:{fontStyle:"italic",fontSize:".9rem",lineHeight:1.7,color:"#e8c96f",margin:0}},st.oroscopo.consiglio)
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App,null));
</script>
<script>

  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'})
